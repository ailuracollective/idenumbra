[package]
name = "idenumbra"
description = "CLI for installing idenumbra validators into a project (shadcn-style codegen)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["identification", "validation", "cli", "codegen"]
categories = ["command-line-utilities"]

[[bin]]
name = "idenumbra"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
console = "0.15"
indicatif = "0.18"
human-panic = "2"
reqwest = { version = "0.13", features = ["blocking"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
